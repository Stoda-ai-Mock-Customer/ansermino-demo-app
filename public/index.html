<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Excuse-o-Matic</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #fff8e7; color: #222; display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 16px; box-sizing: border-box; text-align: center; }
    h1 { font-size: 2.5rem; margin-bottom: 0; }
    #excuse { font-size: 1.5rem; min-height: 3em; margin: 1.5rem auto; max-width: 32rem; }
    button { font-size: 1.25rem; padding: 0.75rem 1.5rem; border: 3px solid #222; border-radius: 999px; background: #ffcc00; cursor: pointer; box-shadow: 4px 4px 0 #222; }
    button:active { transform: translate(4px, 4px); box-shadow: none; }
    small { display: block; margin-top: 1rem; color: #666; }
  </style>
</head>
<body>
  <main>
    <h1>🦆 Excuse-o-Matic</h1>
    <p>Industrial-grade excuses for missed deadlines.</p>
    <p id="excuse">Press the button. Accept no responsibility.</p>
    <button id="go">Generate excuse</button>
    <small id="count"></small>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
